name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk WaffleStudio.apk
      - uses: actions/upload-artifact@v4
        with: { name: WaffleStudio-apk, path: WaffleStudio.apk }
      - name: Publish to fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Waffle Studio Android app
          body: "Download WaffleStudio.apk below and install it on your Android phone."
          make_latest: true
          files: WaffleStudio.apk
