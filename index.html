<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Soft blush "pressed clay" look: warm off-white surfaces, raised cards, one red accent. */
:root{
  color-scheme:light;
  --bg:#f4ebe8; --card:#f1e7e4; --raise:#f6efec; --ink:#1e1716; --muted:#6e6360; --faint:#9c918d;
  --line:#e6d9d5; --red:#c8312a; --red-ink:#ffffff; --blush:#f2c3bd; --gold:#d8a850; --wa:#1f8a52;
  --sh:8px 8px 20px rgba(168,118,106,.20),-7px -7px 16px rgba(255,255,255,.9);
  --sh-sm:4px 4px 10px rgba(168,118,106,.18),-4px -4px 9px rgba(255,255,255,.9);
  --in:inset 3px 3px 7px rgba(168,118,106,.18),inset -3px -3px 7px rgba(255,255,255,.85);
  --head:'Archivo',system-ui,sans-serif; --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(120% 420px at 50% -60px,var(--blush),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:22px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh)}
.num{font-variant-numeric:tabular-nums}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);background-image:radial-gradient(90% 60% at 50% 40%,var(--blush),transparent 70%);transition:opacity .5s ease,visibility .5s}
#splash.done{opacity:0;visibility:hidden}
.sp-in{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
.sp-mark{width:92px;height:92px;border-radius:30px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;overflow:hidden;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
.sp-mark img{width:100%;height:100%;object-fit:cover}
.sp-mark .mono{font-family:var(--head);font-weight:900;font-size:34px;color:var(--red)}
.sp-name{font-family:var(--head);font-weight:900;font-size:clamp(34px,10vw,54px);letter-spacing:-.02em;line-height:1}
.sp-name span{display:inline-block;opacity:0;transform:translateY(24px);animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.sp-tag{color:var(--muted);font-weight:600;opacity:0;animation:fade .6s ease forwards;animation-delay:.9s}
.sp-bar{width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;background:var(--red);border-radius:4px;animation:slide 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;background:var(--raise);border-radius:24px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:15px;object-fit:cover;flex:none;background:var(--card);box-shadow:var(--sh-sm)}
.mono{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh-sm);color:var(--red);font-family:var(--head);font-weight:900;font-size:18px}
.brand b{font-family:var(--head);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--red)}
.sq{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--raise);box-shadow:var(--sh-sm);color:var(--ink);flex:none}
.sq:active,.tile:active .tbox,.pill:active,.stp button:active{box-shadow:var(--in)}

/* hero */
.hero{display:grid;gap:6px;padding:4px 4px 0}
.hero .date{color:var(--muted);font-weight:600;font-size:15px}
.hero h1{font-family:var(--head);font-weight:900;font-size:clamp(32px,9vw,44px);letter-spacing:-.02em;line-height:1.05}
.hero p{color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--raise);box-shadow:var(--sh-sm);font-size:13.5px;font-weight:700}
.chip .i{width:16px;height:16px;color:var(--red)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.tile{display:grid;justify-items:center;gap:8px;padding:8px 2px 10px;border-radius:20px;background:var(--raise);box-shadow:var(--sh-sm);font-weight:800;font-size:13.5px;text-decoration:none;color:var(--ink);text-align:center}
.tbox{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh-sm);color:var(--red)}
.tile.main .tbox{background:var(--red);color:var(--red-ink)}

/* menu */
.bar{display:grid;gap:12px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-radius:999px;background:var(--card);box-shadow:var(--in)}
.search .i{color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:999px;background:var(--raise);box-shadow:var(--sh-sm);font-weight:800;font-size:14px}
.cat{display:grid;gap:12px;scroll-margin-top:16px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.cat-h h2{font-family:var(--head);font-weight:800;font-size:22px}
.cat-h span{color:var(--muted);font-weight:700;font-size:13px}
.items{display:grid;gap:14px}
.it{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px;border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.it.off{opacity:.55}
.pic{width:96px;height:96px;border-radius:18px;object-fit:cover;display:block;background:var(--raise);box-shadow:var(--sh-sm)}
.pic.ph{display:grid;place-items:center;font-family:var(--head);font-weight:900;font-size:32px;color:var(--red)}
.it-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.it-t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.it-t h3{font-weight:800;font-size:17px;line-height:1.2}
.best{flex:none;font-size:11px;font-weight:800;color:var(--red);background:#f7dcd8;border-radius:999px;padding:2px 8px}
.desc{color:var(--muted);font-size:13.5px;line-height:1.4}
.soldout{color:var(--red);font-weight:800;font-size:13px}
.vars{display:grid;gap:8px;margin-top:auto;padding-top:6px}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vr .vn{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vr .vp{font-family:var(--head);font-weight:800;font-size:17px;margin-left:6px}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--raise);box-shadow:var(--sh-sm);color:var(--ink)}
.stp button.add{background:var(--red);color:var(--red-ink)}
.stp button:disabled{opacity:.4;box-shadow:none}
.stp .i{width:18px;height:18px}
.stp span{min-width:24px;text-align:center;font-weight:800}

/* info */
.info{padding:20px;display:grid;gap:14px}
.info h2{font-family:var(--head);font-weight:800;font-size:22px}
.info .lead{color:var(--red);font-weight:800}
.evl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evl li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--raise);box-shadow:var(--sh-sm);font-weight:700;font-size:15px}
.evl .i{color:var(--red);width:18px;height:18px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 14px;border-radius:16px;background:var(--raise);box-shadow:var(--sh-sm);font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;text-align:center}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.full{grid-column:1/-1}
.btn:disabled{opacity:.5}
.phone{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:.02em;user-select:all;text-align:center}
.foot{text-align:center;color:var(--faint);font-size:13px;font-weight:600}
.foot a{color:inherit}

/* order bar & sheet */
.obar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
.obar button{pointer-events:auto;max-width:688px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding:0 20px;border-radius:20px;background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:0 12px 28px rgba(200,49,42,.35)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(40,24,20,.38);display:grid;align-items:end;justify-items:center;animation:fade .2s ease}
.sheet{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px max(18px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;gap:16px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h3{font-family:var(--head);font-weight:800;font-size:21px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh-sm)}
.line b{display:block;font-size:15px}
.line small{color:var(--muted);font-weight:600}
.sum{display:grid;gap:6px;padding:4px}
.sum div{display:flex;justify-content:space-between;color:var(--muted);font-weight:700}
.sum .tot{color:var(--ink);font-family:var(--head);font-weight:900;font-size:22px}
.f{display:grid;gap:6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.f input,.f textarea,.f select{width:100%;border:0;outline:none;background:var(--card);box-shadow:var(--in);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;color:var(--ink)}
.f textarea{min-height:84px;resize:vertical}
.f.err input,.f.err textarea{box-shadow:var(--in),0 0 0 2px var(--red)}
.f em{color:var(--red);font-style:normal;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--card);box-shadow:var(--in)}
.seg button{height:42px;border-radius:12px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--raise);box-shadow:var(--sh-sm);color:var(--red)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--sh-sm);font-weight:700}
.tog input{width:22px;height:22px;accent-color:var(--red)}
.hint{color:var(--muted);font-size:13px;font-weight:600}
.qr{justify-self:center;padding:14px;background:#fff;border-radius:20px;box-shadow:var(--sh-sm)}
.qr img,.qr canvas{display:block;width:210px;height:210px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
[hidden]{display:none!important}

/* admin */
.adm{display:grid;gap:16px}
.ahead{display:flex;align-items:center;gap:12px}
.ahead h1{font-family:var(--head);font-weight:900;font-size:28px;flex:1}
.box{padding:18px;display:grid;gap:14px}
.box h2{font-family:var(--head);font-weight:800;font-size:19px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.arow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;background:var(--raise);box-shadow:var(--sh-sm)}
.arow .pic{width:52px;height:52px;border-radius:12px;font-size:20px}
.arow div{flex:1;min-width:0}
.arow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small{color:var(--muted);font-weight:700}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh-sm)}
.mini.del{color:var(--red)}
.mini .i{width:18px;height:18px}
.vchip{display:flex;align-items:center;gap:4px}
.vchip input{width:110px}
.link{color:var(--red);font-weight:800;font-size:14px;padding:6px 0}
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.pubbar>div{max-width:688px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 16px;border-radius:20px;background:var(--raise);box-shadow:var(--sh)}
.pubbar span{flex:1;font-weight:800;font-size:14px}
</style>
</head>

function wrapT(g,s,w,max){var ws=String(s||'').split(/\s+/).filter(Boolean),o=[],c='';ws.forEach(function(x){var t=c?c+' '+x:x;if(g.measureText(t).width>w&&c){o.push(c);c=x}else c=t});if(c)o.push(c);if(o.length>max){o=o.slice(0,max);o[max-1]=fit(g,o[max-1]+'…',w)}return o}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function cover(g,im,x,y,w,h,r){g.save();rr(g,x,y,w,h,r);g.clip();var s=Math.max(w/im.naturalWidth,h/im.naturalHeight);g.drawImage(im,x+(w-im.naturalWidth*s)/2,y+(h-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);g.restore()}

function slug(m){return (m.name||'menu').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'menu'}
function toPdf(pages,name){var doc=new jspdf.jsPDF({unit:'mm',format:'a4',compress:true});pages.forEach(function(p,i){if(i)doc.addPage();doc.addImage(p.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297,undefined,'FAST')});doc.save(name)}
async function downloadPdf(){if(!window.jspdf){toast('PDF tool could not load. Check your internet.');return}if(S.busy)return;S.busy='pdf';render();try{toPdf(await menuPages(M()),slug(M())+'-menu.pdf');toast('Menu PDF downloaded')}catch(e){toast('Couldn’t make the PDF. Try again.')}S.busy='';render()}
async function qrPdf(){if(!window.jspdf)return toast('PDF tool could not load.');await fonts();var m=M(),h=document.createElement('div'),qc=drawQr(h,siteUrl(),640);if(!qc)return;var lg=await loadImg(m.logo);
  var W=1240,Hh=1754,cv=document.createElement('canvas');cv.width=W;cv.height=Hh;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,Hh);g.fillStyle=RED;g.fillRect(0,0,W,18);

  g.drawImage(qc,W/2-320,540,640,640);g.fillStyle=RED;g.font=H(900,52);g.fillText('Scan for our menu',W/2,1290);g.fillStyle=SOFT;g.font=B(700,30);g.fillText('Menu  •  Order  •  Events',W/2,1345);
  g.fillStyle=INK;g.font=B(800,40);g.fillText('WhatsApp / Call: '+m.phone,W/2,1460);toPdf([cv],slug(m)+'-qr-poster.pdf')}

/* ---------- photos & GitHub ---------- */
function shrink(file,max,png){return new Promise(function(res,rej){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){var s=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(png?'image/png':'image/jpeg',.84))};i.onerror=function(){URL.revokeObjectURL(u);rej()};i.src=u})}
function gh(path,opt){var g=S.gh;return fetch('https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)+'/contents/'+path+(opt&&opt.method==='PUT'?'':'?ref='+encodeURIComponent(g.branch)),Object.assign({headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'}},opt||{}))}
async function putFile(path,b64,msg){var sha;var r=await gh(path);if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw r.status;
  r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64,branch:S.gh.branch,sha:sha})});if(!r.ok)throw r.status}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
async function publish(){
  var g=S.gh;if(!g.owner||!g.repo||!g.token){toast('Fill in GitHub publishing first.');var f=$('#g-owner');if(f)f.scrollIntoView({block:'center'});return}
  S.busy='pub';render();
  try{
    var out=clone(draft),n=0,stamp=Date.now().toString(36);
    async function img(v,name){if(!v||v.indexOf('data:')!==0)return v;var ext=v.indexOf('image/png')>-1?'png':'jpg',path='images/'+name+'-'+stamp+'.'+ext;await putFile(path,v.split(',')[1],'Update photo '+name);n++;return path}
    out.logo=await img(out.logo,'logo');
    for(var c of out.categories)for(var it of c.items)it.image=await img(it.image,it.id);
    await putFile('menu.json',b64utf8(JSON.stringify(out,null,1)),'Update menu');
    LIVE=clone(out);draft=clone(out);LS.del('ws_draft');toast('Published. The live menu updates in about a minute.');
  }catch(e){toast(e===401||e===403?'GitHub refused the token. Check it has write access to this repo.':e===404?'Repository not found. Check username and repo name.':'Publishing failed. Check your internet and try again.')}
  S.busy='';render();
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){var el=e.target;
  if(el.id==='q'){S.q=el.value;var y=window.scrollY,a=document.activeElement;render();var q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}
  if(el.dataset.c){S.cust[el.dataset.c]=el.value;LS.set('ws_cust',S.cust);var s=$('#send');if(s)s.href=wa(orderMsg());return}
  if(el.dataset.g){S.gh[el.dataset.g]=el.value.trim();LS.set('ws_gh',S.gh);return}
  if(el.dataset.f){var f=el.dataset.f,p=f.split(':'),v=el.value;
    if(p[0]==='cat')catById(p[1]).name=v;else if(p[0]==='var')catById(p[1]).variants[+p[2]]=v;else if(f==='events')draft.events=v.split('\n').map(function(x){return x.trim()}).filter(Boolean);else if(f==='parcelFee')draft.parcelFee=Math.max(0,Number(v)||0);else draft[f]=v;
    saveDraft();refreshBar();if(f==='name')document.title=v;return}
  if(el.dataset.e&&el.type!=='checkbox'){var k=el.dataset.e;if(k.indexOf('p:')===0)S.editing.item.prices[+k.slice(2)]=el.value===''?'':Math.max(0,Number(el.value)||0);else S.editing.item[k]=el.value}
});
document.addEventListener('change',async function(e){var el=e.target;
  if(el.id==='parcel'){S.parcel=el.checked;LS.set('ws_parcel',S.parcel);render()}
  else if(el.id==='ordersOn'){draft.orders=el.checked;saveDraft();refreshBar()}
  else if(el.dataset.e&&el.type==='checkbox')S.editing.item[el.dataset.e]=el.checked;
  else if(el.id==='photo'&&el.files[0]){try{S.editing.item.image=await shrink(el.files[0],900,false);render()}catch(x){toast('Couldn’t read that photo. Try a JPG or PNG.')}}
  else if(el.id==='logoFile'&&el.files[0]){try{draft.logo=await shrink(el.files[0],500,/png|webp/.test(el.files[0].type));saveDraft();render()}catch(x){toast('Couldn’t read that image.')}}
});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,k=b.dataset.k,v=b.dataset.v,c=b.dataset.c,id=b.dataset.i;
  if(a==='scrim'){if(e.target===b){S.sheet=null;S.editing=null;render()}return}
  switch(a){
  case 'inc':inc(k,1);render();break;
  case 'dec':inc(k,-1);render();break;
  case 'sheet':S.sheet=v;render();break;
  case 'close':S.sheet=null;S.editing=null;S.errors={};render();break;
  case 'clear':S.cart={};LS.set('ws_cart',S.cart);S.sheet=null;render();break;
  case 'ctype':S.cust.type=v;LS.set('ws_cust',S.cust);render();break;
  case 'send':var er={},cu=S.cust;if(!cu.name.trim())er.name='Enter your name.';if(digits(cu.phone).replace(/^91(?=\d{10}$)/,'').length!==10)er.phone='Enter a 10-digit number.';if(cu.type==='delivery'&&!cu.address.trim())er.address='Enter the address.';S.errors=er;if(Object.keys(er).length){e.preventDefault();render()}else b.href=wa(orderMsg());break;
  case 'jump':var t=document.getElementById(v);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'qr':S.sheet='qr';render();break;
  case 'qrpdf':qrPdf();break;
  case 'pdf':downloadPdf();break;
  case 'leave':e.preventDefault();history.replaceState(null,'',location.pathname);S.admin=false;render(false);window.scrollTo(0,0);break;
  case 'publish':publish();break;
  case 'export':var bl=new Blob([JSON.stringify(draft,null,1)],{type:'application/json'}),u=URL.createObjectURL(bl),an=document.createElement('a');an.href=u;an.download='menu.json';an.click();setTimeout(function(){URL.revokeObjectURL(u)},2000);break;
  case 'reset':if(b.dataset.sure){draft=clone(LIVE);LS.del('ws_draft');render()}else{b.dataset.sure=1;b.textContent='Tap again to discard';setTimeout(function(){if(b.isConnected){delete b.dataset.sure;b.textContent='Discard changes'}},3000)}break;
  case 'rmlogo':draft.logo='';saveDraft();render();break;
  case 'addCat':draft.categories.push({id:'c'+Date.now().toString(36),name:'New category',variants:[''],items:[]});saveDraft();render();break;
  case 'delCat':if(b.dataset.sure){draft.categories=draft.categories.filter(function(x){return x.id!==c});saveDraft();render()}else{b.dataset.sure=1;b.textContent='Tap again to delete category';}break;
  case 'addVar':var ac=catById(c);if(ac.variants.length===1&&!ac.variants[0])ac.variants[0]='Regular';ac.variants.push('Large');ac.items.forEach(function(it){it.prices.push('')});saveDraft();render();break;
  case 'delVar':var vc=catById(c),vi=+id;vc.variants.splice(vi,1);vc.items.forEach(function(it){it.prices.splice(vi,1)});saveDraft();render();break;
  case 'addItem':var nc=catById(c);S.editing={cid:c,isNew:true,item:{id:'i'+Date.now().toString(36),title:'',desc:'',prices:nc.variants.map(function(){return ''}),best:false,available:true,image:''}};S.sheet='edit';render();break;
  case 'edit':S.editing={cid:c,item:clone(catById(c).items.find(function(x){return x.id===id}))};S.sheet='edit';render();break;
  case 'avail':var it=catById(c).items.find(function(x){return x.id===id});it.available=it.available===false;saveDraft();render();break;
  case 'delItem':if(b.dataset.sure){var dc=catById(c);dc.items=dc.items.filter(function(x){return x.id!==id});saveDraft();render()}else{b.dataset.sure=1;b.style.background='var(--red)';b.style.color='#fff';toast('Tap delete again to remove');}break;
  case 'rmphoto':S.editing.item.image='';render();break;
  case 'saveItem':var E=S.editing,ec=catById(E.cid);if(!E.item.title.trim()){toast('Give the item a name.');return}E.item.title=E.item.title.trim();if(E.isNew)ec.items.push(E.item);else ec.items=ec.items.map(function(x){return x.id===E.item.id?E.item:x});S.editing=null;S.sheet=null;saveDraft();render();break;
  }
});

/* ---------- boot with splash ---------- */
function splash(m){var nm=$('#spName');nm.innerHTML=String(m.name).split('').map(function(ch,i){return '<span style="animation-delay:'+(.25+i*.045)+'s">'+(ch===' '?'&nbsp;':esc(ch))+'</span>'}).join('');$('#spTag').textContent=m.tagline||'';$('#spMark').innerHTML=m.logo?'<img src="'+esc(m.logo)+'" alt="">':'<span class="mono" style="box-shadow:none;background:none">'+esc(initials(m.name).toUpperCase())+'</span>'}
(async function(){
  var seed=null;try{seed=JSON.parse($('#seed').textContent)}catch(e){}
  var t0=Date.now();
  try{var r=await fetch('menu.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;LIVE=await r.json()}catch(e){LIVE=seed}
  if(!LIVE){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">The menu could not be loaded. Check your internet and reload.</p>';return}
  var d=LS.get('ws_draft',null);draft=d||clone(LIVE);
  splash(S.admin?draft:LIVE);render();
  var seen=false;try{seen=sessionStorage.getItem('ws_splash')}catch(e){}
  var wait=seen?300:Math.max(0,1900-(Date.now()-t0));
  setTimeout(function(){$('#splash').classList.add('done');try{sessionStorage.setItem('ws_splash','1')}catch(e){}},wait);
})();
})();
